<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Clash of Clans Dashboard and Planner</title>
  <meta name="description" content="Track Clash of Clans village progress from the in-game data export: upgrades, timers, events and planning.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%B0%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <div class="brand">
      <svg class="shield" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2 36 8v12c0 9-7 16-16 18C11 36 4 29 4 20V8z" fill="#f4b400" stroke="#3a2500" stroke-width="2.5"/><path d="M12 22l5 5 11-12" fill="none" stroke="#3a2500" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1>Clash of Clans Dashboard and Planner</h1>
    </div>
    <div class="acct">
      <label class="skin-pick">Style
        <select id="skinSel" aria-label="Visual style">
          <option value="analytics">Clean analytics</option>
          <option value="townhall">Town Hall theme</option>
        </select></label>
      <select id="acctSel" aria-label="Account"></select>
      <button class="btn gold" id="importBtn" type="button">+ Import export</button>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>
<main id="main"></main>

<dialog id="importDlg">
  <div class="dlg-h"><h3>Import village export</h3><button class="x" type="button" data-close aria-label="Close">×</button></div>
  <form class="dlg-b" id="importForm">
    <p class="small muted" style="margin:0">In Clash of Clans open Settings → More Settings → Data Export → Copy, then paste the JSON here or choose a saved file. Each import becomes a dated snapshot for that account's tag.</p>
    <textarea id="importText" placeholder='{"tag":"#ABC123","timestamp":...}'></textarea>
    <div class="form-row">
      <label class="f">Or load a file<input type="file" id="importFile" accept=".json,.txt,application/json,text/plain"></label>
      <label class="f">Account nickname (optional)<input type="text" id="importName" placeholder="Main, Mini…"></label>
    </div>
    <div id="importErr" class="small" style="color:var(--bad)"></div>
    <div class="form-row" style="justify-content:flex-end"><button class="btn ghost" type="button" data-close>Cancel</button><button class="btn" type="submit">Save snapshot</button></div>
  </form>
</dialog>

<dialog id="eventDlg">
  <div class="dlg-h"><h3 id="eventDlgTitle">Event</h3><button class="x" type="button" data-close aria-label="Close">×</button></div>
  <form class="dlg-b" id="eventForm">
    <label class="f">Name<input type="text" id="evName" required></label>
    <div class="form-row">
      <label class="f">Type<select id="evType"><option value="discount">Upgrade discount</option><option value="season">Season</option><option value="seasonal">Seasonal / medal event</option><option value="clangames">Clan Games</option><option value="cwl">Clan War League</option><option value="raid">Raid Weekend</option><option value="other">Other</option></select></label>
      <label class="f">Start<input type="date" id="evStart" required></label>
      <label class="f">End<input type="date" id="evEnd" required></label>
    </div>
    <div class="form-row">
      <label class="f">Upgrade cost change %<input type="number" id="evCost" min="-100" max="100" step="1" value="0"></label>
      <label class="f">Upgrade time change %<input type="number" id="evTime" min="-100" max="100" step="1" value="0"></label>
      <label class="f">Applies to<select id="evTarget"><option value="all">Home builders + lab</option><option value="builder">Builders only</option><option value="lab">Lab only</option><option value="hero">Heroes only</option></select></label>
    </div>
    <label class="f">Notes<input type="text" id="evNotes"></label>
    <div class="form-row" style="justify-content:space-between">
      <button class="btn danger" type="button" id="evDelete">Hide event</button>
      <span style="display:flex;gap:8px"><button class="btn ghost" type="button" data-close>Cancel</button><button class="btn" type="submit">Save</button></span>
    </div>
  </form>
</dialog>

<script src="js/game-data.js"></script>
<script src="js/app.js"></script>

</body></html>
